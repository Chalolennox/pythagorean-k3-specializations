name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 code/validate.py
      - run: python3 code/verify_factorizations.py
      - run: python3 code/verify_local_i0star.py
      - run: python3 code/verify_fibre_configuration.py
      - run: python3 code/verify_reviewer_context.py
      - run: python3 code/curated/check_curated_python.py
      - run: python3 code/verify_two_cover_note.py
      - run: python3 code/verify_18P_note.py
      - run: python3 code/verify_chebotarev_mod8.py
      - run: python3 code/verify_local_sign.py
      - run: python3 code/verify_square_class_identity.py 1000000
      - run: python3 code/verify_index_four.py
      - run: python3 code/verify_partial_split.py 60000
      - run: python3 code/check_problem_h_definition.py
      - run: python3 code/figure_p_plus_t_orbit.py --check
      - run: python3 code/verify_fourfold_separation.py
      - run: python3 code/mirror_projection_eps.py 40
      - run: python3 code/verify_orbit_laws.py --quick
      - run: python3 code/verify_angular_symmetry.py
      - run: python3 code/root_number_formula.py
      - run: python3 code/root_number_crosscheck.py --check data/root_number_crosscheck_pari.txt
      - run: python3 code/verify_paired_root_numbers_note.py
      - run: python3 code/verify_F_collisions.py --quick
      - run: python3 code/verify_2adic_law.py --quick
      - run: python3 code/verify_jacobi_identities.py --quick
      - run: python3 code/verify_consecutive_qualifying.py --quick
      - run: python3 code/verify_gap_two.py --quick
      - run: python3 code/verify_gap_three.py --quick
      - run: python3 code/verify_gap_k.py --quick
      - run: python3 code/verify_group_G.py
      - run: python3 code/verify_support_two.py
      - run: python3 code/support_two_densities.py
      - run: python3 code/support_two_affine_probability.py
      - run: python3 code/verify_support_structure.py --quick
      - run: python3 code/verify_kummer_compositum.py --quick
      - run: python3 code/verify_dossier_elementary.py
      - run: python3 code/verify_eligible_triples.py --quick
      - run: python3 code/verify_neutrality_circle.py
      - run: python3 code/verify_mirror_collapse.py --quick
      - run: python3 code/verify_rotation_coding.py --quick
      - run: python3 code/check_revision.py
      - run: python3 code/verify_twist_rank_over_F5.py
      - run: python3 code/verify_integral_resolution_note.py
      - run: python3 code/apparition_pattern.py --quick
      - run: python3 code/rotation_coding_F_n.py --quick
