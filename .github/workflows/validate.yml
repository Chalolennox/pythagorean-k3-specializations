name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python3 code/validate.py
      - run: python3 code/verify_factorizations.py
      - run: python3 code/verify_local_i0star.py
      - run: python3 code/verify_fibre_configuration.py
      - run: python3 code/verify_reviewer_context.py
      - run: python3 code/curated/check_curated_python.py
      - run: python3 code/verify_two_cover_note.py
      - run: python3 code/verify_18P_note.py
      - run: python3 code/verify_chebotarev_mod8.py
      - run: python3 code/verify_local_sign.py
      - run: python3 code/verify_square_class_identity.py 1000000
      - run: python3 code/verify_index_four.py
      - run: python3 code/verify_partial_split.py 60000
      - run: python3 code/check_problem_h_definition.py
      - run: python3 code/figure_p_plus_t_orbit.py --check
      - run: python3 code/verify_fourfold_separation.py
      - run: python3 code/mirror_projection_eps.py 40
      - run: python3 code/verify_orbit_laws.py --quick
      - run: python3 code/verify_mirror_collapse.py --quick
      - run: python3 code/verify_rotation_coding.py --quick
      - run: python3 code/verify_twist_rank_over_F5.py
      - run: python3 code/verify_integral_resolution_note.py
