<svg xmlns="http://www.w3.org/2000/svg" width="760" height="570" viewBox="0 0 760 570"><rect width="760" height="570" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172333"><text x="28" y="34" font-size="24" font-weight="bold">Eligible-prime patterns in a composition rectangle</text><text x="28" y="58" font-size="14">Corners: Q, Q+P (top); Q+T, Q+P+T (bottom). Orange = eligible.</text><rect x="28" y="82" width="704" height="84" rx="8" fill="#f5f7fa"/><path d="M55 102 H99 V146 H55 Z" fill="none" stroke="#9aa5b1"/><circle cx="55" cy="102" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="102" r="10" fill="#dce2e9" stroke="#aab4c0"/><circle cx="55" cy="146" r="10" fill="#dce2e9" stroke="#aab4c0"/><circle cx="99" cy="146" r="10" fill="#dce2e9" stroke="#aab4c0"/><text x="130" y="114" font-size="19" font-weight="bold">Single-corner membership</text><text x="130" y="139" font-size="15">−1 · contributes to parity</text><rect x="28" y="174" width="704" height="84" rx="8" fill="#f5f7fa"/><path d="M55 194 H99 V238 H55 Z" fill="none" stroke="#9aa5b1"/><circle cx="55" cy="194" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="194" r="10" fill="#dce2e9" stroke="#aab4c0"/><circle cx="55" cy="238" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="238" r="10" fill="#dce2e9" stroke="#aab4c0"/><text x="130" y="206" font-size="19" font-weight="bold">Mirror survival</text><text x="130" y="231" font-size="15">+1 · excluded on the orbit</text><rect x="28" y="266" width="704" height="84" rx="8" fill="#f5f7fa"/><path d="M55 286 H99 V330 H55 Z" fill="none" stroke="#9aa5b1"/><circle cx="55" cy="286" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="286" r="10" fill="#dce2e9" stroke="#aab4c0"/><circle cx="55" cy="330" r="10" fill="#dce2e9" stroke="#aab4c0"/><circle cx="99" cy="330" r="10" fill="#d97706" stroke="#b45309"/><text x="130" y="298" font-size="19" font-weight="bold">Diagonal survival</text><text x="130" y="323" font-size="15">+1 · exceptional primes only</text><rect x="28" y="358" width="704" height="84" rx="8" fill="#f5f7fa"/><path d="M55 378 H99 V422 H55 Z" fill="none" stroke="#9aa5b1"/><circle cx="55" cy="378" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="378" r="10" fill="#d97706" stroke="#b45309"/><circle cx="55" cy="422" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="422" r="10" fill="#dce2e9" stroke="#aab4c0"/><text x="130" y="390" font-size="19" font-weight="bold">Triple membership</text><text x="130" y="415" font-size="15">−1 · excluded by mirror disjointness</text><rect x="28" y="450" width="704" height="84" rx="8" fill="#f5f7fa"/><path d="M55 470 H99 V514 H55 Z" fill="none" stroke="#9aa5b1"/><circle cx="55" cy="470" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="470" r="10" fill="#d97706" stroke="#b45309"/><circle cx="55" cy="514" r="10" fill="#d97706" stroke="#b45309"/><circle cx="99" cy="514" r="10" fill="#d97706" stroke="#b45309"/><text x="130" y="482" font-size="19" font-weight="bold">Complete survival</text><text x="130" y="507" font-size="15">+1 · excluded by mirror disjointness</text><text x="28" y="560" font-size="13">Local parity factor = (−1) to the power of the number of orange corners. Representative patterns.</text></g></svg>